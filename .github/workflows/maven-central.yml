name: Maven Central Release

on:
  push:
    branches: [master]
    paths:
      - "gradle/libs.versions.toml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^freetime = "\([^"]*\)"/\1/p' gradle/libs.versions.toml | head -n1)"
          if [[ -z "$VERSION" ]]; then
            echo "Missing [versions].freetime in gradle/libs.versions.toml"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Freetime Core version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Stop if version is already released
        id: duplicate
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.tag }} already exists; nothing to release."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.duplicate.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.duplicate.outputs.skip != 'true'

      - name: Check required secrets
        if: steps.duplicate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for name in SIGNING_KEY SIGNING_PASSWORD MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Build, test and stage Maven artifacts
        if: steps.duplicate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean test assembleRelease publishAllPublicationsToCentralBundleRepository -PreleaseVersion="$RELEASE_VERSION"

      - name: Verify staged modules
        if: steps.duplicate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="build/central-repository/me/free-time"
          for artifact in freetime-core freetime-design freetime-updater freetime-browser freetime-donations; do
            test -f "$base/$artifact/$RELEASE_VERSION/$artifact-$RELEASE_VERSION.pom"
            test -f "$base/$artifact/$RELEASE_VERSION/$artifact-$RELEASE_VERSION.aar"
          done

      - name: Add checksums
        if: steps.duplicate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          repo="build/central-repository"
          while IFS= read -r -d '' file; do
            case "$file" in
              *.asc|*.md5|*.sha1|*.sha256|*.sha512) continue ;;
            esac
            md5sum "$file" | awk '{print $1}' > "$file.md5"
            sha1sum "$file" | awk '{print $1}' > "$file.sha1"
            sha256sum "$file" | awk '{print $1}' > "$file.sha256"
            sha512sum "$file" | awk '{print $1}' > "$file.sha512"
          done < <(find "$repo" -type f -print0)

      - name: Create Central bundle
        if: steps.duplicate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd build/central-repository
          zip -q -r ../central-bundle.zip .

      - name: Upload and automatically publish on Maven Central
        if: steps.duplicate.outputs.skip != 'true'
        id: central
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w 0)"
          DEPLOYMENT_ID="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $TOKEN" \
            --form "bundle=@build/central-bundle.zip;type=application/octet-stream" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=Freetime-Core-$RELEASE_VERSION&publishingType=AUTOMATIC")"
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "Central deployment: $DEPLOYMENT_ID"

      - name: Wait for Central result
        if: steps.duplicate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w 0)"
          ID="${{ steps.central.outputs.deployment_id }}"
          for attempt in {1..30}; do
            BODY="$(curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $TOKEN" \
              "https://central.sonatype.com/api/v1/publisher/status?id=$ID")"
            echo "$BODY"
            STATE="$(printf '%s' "$BODY" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("deploymentState",""))')"
            case "$STATE" in
              PUBLISHED) exit 0 ;;
              FAILED) echo "Maven Central validation/publication failed."; exit 1 ;;
            esac
            sleep 20
          done
          echo "Timed out waiting for Maven Central publication."
          exit 1

      - name: Create and push GitHub tag
        if: steps.duplicate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Freetime Core $RELEASE_VERSION"
          git push origin "$TAG"

      - name: Upload Central bundle
        if: steps.duplicate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: central-bundle-${{ steps.version.outputs.version }}
          path: build/central-bundle.zip
          if-no-files-found: error
